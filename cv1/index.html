  :root{
    --bg:#09090b; --card:#111113; --line:#26262b; --text:#e6e3dd; --muted:#9b9892; --accent:#ff5f2e; --accent2:#ff8a57;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{font-size:112.5%}   /* كبّر/صغّر كل الخطوط من هون: 100% = الأصلي */
  body{background:var(--bg);color:var(--text);font-family:"Archivo","Cairo",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;
       display:flex;flex-direction:column;height:100dvh;overflow:hidden;
       background-image:radial-gradient(900px 400px at 15% -10%,rgba(255,95,46,.14),transparent 60%),radial-gradient(700px 400px at 110% 10%,rgba(255,179,71,.08),transparent 60%);background-repeat:no-repeat}
  a{color:var(--accent);text-decoration:none}
  bdi.ltr{direction:ltr;unicode-bidi:isolate}

  /* ---------- Top bar ---------- */
  #topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:12px}
  .brand{font-weight:800;direction:ltr}
  .tools{display:flex;gap:8px;align-items:center}
  #langBtn{font-weight:700;min-width:52px}
  .brand .dot{color:var(--accent)}
  .btn{display:inline-block;padding:9px 18px;border-radius:999px;font-weight:600;font-size:.9rem;border:1px solid var(--line);color:var(--text);background:none;cursor:pointer;font-family:inherit;transition:.2s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.1)}

  /* ---------- Edit bar (only with ?edit) ---------- */
  .editbar{margin:0 18px 6px;background:#1a1209;border:1px dashed var(--accent2);border-radius:12px;padding:8px 12px;font-size:.82rem;color:var(--accent2)}
  .editbar .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .editbar button{background:none;border:1px solid var(--accent2);color:var(--accent2);padding:4px 11px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:.82rem}
  .editbar button.on{background:var(--accent2);color:#1a1209}
  .editbar code{background:#00000055;padding:2px 6px;border-radius:6px;color:#fff;direction:ltr;unicode-bidi:isolate}

  /* ---------- Deck ---------- */
  .deck{flex:1;min-height:0;overflow:hidden;position:relative}
  .track{display:flex;height:100%;transition:transform .55s cubic-bezier(.65,.05,.2,1)}
  .slide{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;padding:12px 22px 20px}
  .slide-in{max-width:1000px;margin:0 auto;width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center}
  .label{color:var(--accent);font-weight:700;font-size:.9rem}
  .stitle{font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.25;margin:2px 0 20px;font-weight:800}

  /* ---------- Controls ---------- */
  #controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px 14px}
  .nbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.3rem;line-height:1;cursor:pointer;transition:.2s}
  .nbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nbtn:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:8px;align-items:center}
  .dots button{width:9px;height:9px;border-radius:999px;border:none;background:#2b2b30;cursor:pointer;transition:.3s;padding:0}
  .dots button.on{width:26px;background:var(--accent)}
  .count{color:var(--muted);font-size:.85rem;min-width:44px;text-align:center;direction:ltr}

  /* ---------- Cover ---------- */
  .cover{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
  .photo{position:relative;width:200px;height:200px;flex:none}
  .photo::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));animation:spin 8s linear infinite}
  .photo::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--bg)}
  .photo img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;object-fit:cover;z-index:2}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cover-text{flex:1;min-width:260px}
  .forbadge{display:inline-block;margin-bottom:12px;padding:3px 14px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:.85rem;font-weight:600}
  .cover h1{font-size:clamp(2.4rem,7vw,4rem);line-height:1.2;font-weight:800}
  .cover h1 .dot{color:var(--accent)}
  .nameen{unicode-bidi:isolate;color:var(--muted);font-weight:600;font-size:1.05rem;margin-top:10px}
  html[dir=rtl] .nameen{direction:ltr;text-align:right}
  html[dir=ltr] .nameen{direction:rtl;text-align:left}
  .headline{margin-top:10px;color:var(--accent2);font-weight:600;font-size:1.05rem;direction:ltr}
  html[dir=rtl] .headline{text-align:right}
  html[dir=ltr] .headline{text-align:left}
  .loc{margin-top:4px;color:var(--muted);font-size:.92rem}
  .summary{margin-top:10px;color:#cfccc6;max-width:58ch}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:28px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
  .stat b{display:block;font-size:1.7rem;line-height:1.3}
  .stat span{color:var(--muted);font-size:.85rem}

  /* ---------- Content blocks ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 20px}
  .card h3{font-size:1.02rem;line-height:1.45}
  .meta{color:var(--muted);font-size:.86rem;margin:2px 0 6px}
  .card ul{padding-inline-start:18px;color:#d3d0ca;font-size:.92rem}
  .card p{color:#d3d0ca;font-size:.92rem}
  .lead{font-size:clamp(1rem,2vw,1.2rem);color:#e6e3dd;max-width:64ch;margin-bottom:12px}
  .quote{border-inline-start:3px solid var(--accent);padding:6px 16px;margin:6px 0 14px;font-size:1.05rem;color:var(--accent2);font-weight:600}
  .q{direction:ltr;unicode-bidi:isolate;color:var(--accent2);font-style:italic;font-size:.88rem;margin-top:6px}
  html[dir=rtl] .q{text-align:right}
  html[dir=ltr] .q{text-align:left}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .tag{background:#18181b;border:1px solid var(--line);padding:4px 14px;border-radius:999px;font-size:.88rem}
  .tag.big{font-size:1rem;padding:6px 18px;border-color:#3a3a40}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .studio-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
  .studio-clients{grid-column:1/-1}
  .stack{display:grid;gap:12px}
  .card.studio-main p{font-size:1rem;line-height:1.9}
  .exp{border-inline-start:3px solid var(--accent)}
  .ach{border-top:3px solid var(--accent)}
  .inline-link{border-bottom:1px solid var(--accent)}
  .more-link{display:inline-block;margin-top:10px;font-size:.88rem;font-weight:700;border-bottom:1px solid var(--accent)}
  .more-link:hover{color:var(--accent2);border-color:var(--accent2)}
  .sub{color:var(--accent2);font-weight:700;font-size:.9rem;margin-bottom:2px}
  .contacts{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .big{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;line-height:1.25;margin-bottom:22px}
  .big span{color:var(--accent)}
  .contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
  .worklinks{direction:ltr;text-align:left}
  .worklinks .sub{margin-bottom:14px}
  .wl{display:flex;flex-direction:column;width:min(250px,100%)}
  .wl a{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-size:.88rem;font-weight:600;color:var(--text);direction:ltr;unicode-bidi:isolate;border-bottom:1px solid var(--line);transition:color .15s,padding .15s}
  .wl a::after{content:"↗";color:var(--accent);font-size:.9em}
  .wl a:last-child{border-bottom:0}
  .wl a.dl::after{content:"↓"}
  .ats{margin-top:22px}
  .wl a:hover{color:var(--accent);padding-inline:6px}
  @media (max-width:760px){.contact-wrap{grid-template-columns:1fr;gap:28px}}

  /* ---------- Timeline (الخبرات: عمود واحد من الأحدث للأقدم) ---------- */
  .tl{position:relative;display:flex;flex-direction:column;gap:10px;padding-inline-start:28px}
  .tl::before{content:"";position:absolute;inset-inline-start:8px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--accent),var(--line))}
  .tl .card{position:relative}
  .tl .card::before{content:"";position:absolute;inset-inline-start:-27px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
  .exprow{display:grid;grid-template-columns:minmax(210px,34%) 1fr;gap:4px 24px;align-items:start;padding:12px 20px}
  .exprow .meta{margin-bottom:0}
  .company{color:var(--accent2);font-weight:700;font-size:.95rem}
  @media (max-width:720px){ .exprow{grid-template-columns:1fr} }

  @media (max-width:720px){
    .grid2,.grid3,.studio-grid{grid-template-columns:1fr}
    .cover{flex-direction:column;text-align:center}
    html[dir] .cover .nameen,html[dir] .cover .headline{text-align:center}
    .cover .cta{justify-content:center}
    .summary{margin-inline:auto}
    .photo{width:160px;height:160px}
    #topbar .btn span{display:none}
  }
  .cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative}
  .menu{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;width:min(360px,calc(100vw - 32px));background:#141416;border:1px solid #3a3a40;border-radius:16px;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .menu-bd{display:none;position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.8)}
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.menu-bd{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}}
  .menu.open + .menu-bd{display:block}
  .menu.open{display:block}
  .menu a{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:9px 12px;border-radius:10px;font-size:.92rem;color:var(--text)}
  .menu a span{color:var(--muted);font-weight:600}
  .menu a bdi{color:var(--accent)}
  .menu a:hover{background:#1d1d21}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- شاشة فقط: تجاوب (كمبيوتر أعرض / موبايل بسكرول سلس) ---------- */
  @media screen{
    html{color-scheme:dark}
    .slide{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
    .slide::-webkit-scrollbar{width:8px}
    .slide::-webkit-scrollbar-track{background:transparent}
    .slide::-webkit-scrollbar-thumb{background:#2b2b30;border-radius:999px}
    .slide::-webkit-scrollbar-thumb:hover{background:#3a3a40}
  }
  @media screen and (min-width:1000px){
    .slide{padding:16px 56px 24px}
    .slide-in{padding-bottom:9vh}
    .slide-in{max-width:1240px}
    .stitle{margin-bottom:22px}
    .lead{max-width:none}
    .photo{width:240px;height:240px}
    .cover{gap:56px}
    .cover-text{min-width:420px}
    .summary{max-width:64ch;font-size:1.05rem}
    .card{padding:16px 24px}
    .card ul,.card p{font-size:.95rem}
    .about-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:56px;align-items:start}
    .about-side{padding-top:6px}
    .about-side .quote{margin-top:0}
    .about-side .tags{margin-top:18px}
    .grid3{gap:16px}.grid2{gap:16px}.studio-grid{gap:16px}
  }
  @media screen and (min-width:1000px) and (max-height:900px){
    .slide{padding:8px 56px 78px}
    .slide-in{padding-bottom:2vh}
    .slide.dense .slide-in{padding-bottom:0}
    .exprow{padding:7px 16px;gap:2px 20px}.tl{gap:6px}
    .tl .card::before{top:13px}
    .card ul,.card p{font-size:.85rem;line-height:1.45}
    .exprow h3{font-size:.95rem;line-height:1.35}
    .stitle{margin-bottom:8px}
    .label{font-size:.82rem}
  }
  @media screen and (min-width:1000px){
    #controls{position:fixed;left:0;right:0;bottom:clamp(14px,calc((100vh - 800px) * .7),200px);padding:0;z-index:5;pointer-events:none}
    #controls>*{pointer-events:auto}
    .slide{padding-bottom:78px}
  }
  @media screen and (min-width:1000px) and (max-height:1100px){
    .exprow{padding:8px 18px}.tl{gap:7px}
    .exprow ul{line-height:1.45}
  }
  @media screen and (min-width:1500px){
    .slide-in{max-width:1380px}
  }
  @media screen and (min-width:1500px) and (min-height:1200px){
    html{font-size:125%}
  }
  @media screen and (max-width:720px){
    .slide{padding:8px 16px 24px}
    #topbar{padding:10px 14px}
    .stitle{margin-bottom:14px}
    .card{padding:14px 16px}
    .nbtn{width:44px;height:44px}
    .about-grid{display:block}
  }

  /* =====================  PDF (طباعة / حفظ كـ PDF)  =====================
     كل سلايد = صفحة واحدة 16:9 */
  @media print{
    @page{size:1280px 720px;margin:0}
    html{font-size:100%}
    html,body{height:auto;overflow:visible;display:block;background:var(--bg)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #topbar,#controls,#editbar,.menu,.menu-bd,.ats{display:none!important}
    .deck{overflow:visible;height:auto}
    .track{display:block;transform:none!important;height:auto}
    .slide{width:1280px;height:720px;overflow:hidden;padding:40px 70px;page-break-after:always;break-after:page;background:var(--bg)}
    .slide:last-child{page-break-after:auto;break-after:auto}
    .slide-in{max-width:none;min-height:100%;zoom:1.2}
    .slide.dense .slide-in{zoom:.94}
    .slide.dense .stitle{margin-bottom:10px}
    #s-work .slide-in{zoom:.95}
    #s-events .slide-in{zoom:.88}
    .grid2{grid-template-columns:repeat(2,1fr)!important}
    .grid3{grid-template-columns:repeat(3,1fr)!important}
    .studio-grid{grid-template-columns:1.6fr 1fr!important}
    .cover{flex-direction:row!important;text-align:start!important}
    .photo::before{animation:none}
    .card{break-inside:avoid}
    .stitle{margin-bottom:14px}
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand" id="brand"></div>
  <div class="tools">
    <button class="btn" id="langBtn" type="button"></button>
    <button class="btn primary" id="pdfBtn" type="button">⬇ <span id="pdfTxt"></span></button>
  </div>
</div>
<div id="editbar"></div>

<div class="deck"><div class="track" id="track"></div></div>

  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
  <button class="nbtn" id="next" aria-label="السلايد التالي">›</button>
</div>

        ${cv.forLabel ? `<span class="forbadge">${esc(cv.forLabel)}</span>` : ""}
        <h1>${esc(cv.name)}<span class="dot">.</span></h1>
        <div class="nameen">${esc(cv.nameEn)}</div>
        <div class="headline">${esc(cv.headline)}</div>
        <div class="loc">${esc(cv.location)}</div>
        <p class="summary">${esc(cv.summary)}</p>
        <div class="cta">${cv.buttons.map(b => b.menu ? `<button class="btn ${b.primary?'primary':''}" type="button" data-menu aria-haspopup="true" aria-expanded="false">${esc(b.label)}</button>` : b.go ? `<a class="btn ${b.primary?'primary':''}" href="#${esc(b.go)}" data-go="${esc(b.go)}">${esc(b.label)}</a>` : `<a class="btn ${b.primary?'primary':''}" href="${esc(b.href)}" target="_blank" rel="noopener">${esc(b.label)}</a>`).join("")}</div>
        ${cv.buttons.some(b => b.menu) ? `<div class="menu" role="menu">${(cv.contact||[]).filter(c => c.href).map(c => `<a role="menuitem" href="${esc(c.href)}"${/^https?:/.test(c.href) ? ' target="_blank" rel="noopener"' : ''}><span>${esc(c.label)}</span><bdi class="ltr">${esc(c.value)}</bdi></a>`).join("")}</div><div class="menu-bd"></div>` : ""}
      </div>
    </div>
    ${cv.stats.length ? `<div class="stats">${cv.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div>` : ""}` },

  about: { dense: true, render: (cv, u) => `
    <h2 class="stitle">${esc(u.about.h)}</h2>
    <div class="about-grid">
      <div class="about-text">${cv.about.map(p => `<p class="lead">${esc(p)}</p>`).join("")}</div>
      <div class="about-side">
        ${cv.quote ? `<div class="quote">${esc(cv.quote)}</div>` : ""}
        <div class="tags">${cv.focus.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>
    </div>` },

  experience: { dense: true, render: (cv, u) => `
    <div class="label">${esc(u.exp.label)}</div><h2 class="stitle">${esc(u.exp.h)}</h2>${expCards(cv.experience)}` },

  experienceEarly: { render: (cv, u) => `
    <div class="label">${esc(u.exp.label)}</div><h2 class="stitle">${esc(u.exp.hEarly)}</h2>${expCards(cv.experienceEarly)}` },

  experienceStart: { dense: true, render: (cv, u) => `
    <div class="label">${esc(u.exp.label)}</div><h2 class="stitle">${esc(u.exp.hStart)}</h2>${expCards(cv.experienceStart)}` },

  work: { render: (cv, u) => `
    <h2 class="stitle">${esc(u.work.label)}</h2>
    ${cv.work.length ? `<div class="grid3">${cv.work.map(w => `
      <div class="card ach"><h3>${esc(w.title)}</h3><div class="meta">${bi(w.type)}</div>
      <p>${esc(w.text)}</p>${w.quote ? `<div class="q">“${esc(w.quote)}”</div>` : ""}</div>`).join("")}</div>`
      : `<p class="lead">${esc(u.work.empty)}</p>`}` },

  studio: { render: (cv, u) => `
    <h2 class="stitle">${esc(u.studio.label)}</h2>
    <div class="studio-grid">
      <div class="card ach studio-main"><h3>${esc(cv.studio.title)}</h3><div class="meta">${bi(cv.studio.period)}</div><p>${esc(cv.studio.text)}</p></div>
      <div class="card ach"><h3>${esc(u.studio.services)}</h3><div class="tags" style="margin-top:8px">${cv.studio.services.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      <div class="card ach studio-clients"><h3>${esc(u.studio.clients)}</h3><div class="tags" style="margin-top:8px">${cv.studio.clients.map(t => `<span class="tag">${ltr(t)}</span>`).join("")}</div></div>
    </div>` },

  events: { render: (cv, u) => `
    <div class="label">${esc(u.events.label)}</div><h2 class="stitle">${esc(u.events.h)}</h2>
    <div class="grid2">${cv.events.map(e => `
      <div class="card ach"><h3>${esc(e.title)}</h3><div class="meta">${esc(e.type)}</div><p>${rich(e.text)}</p>${e.href ? `<a class="more-link" href="${esc(e.href)}" target="_blank" rel="noopener">${esc(u.events.link)}</a>` : ""}</div>`).join("")}</div>` },

  langGear: { render: (cv, u) => `
    <h2 class="stitle">${esc(u.langGear.h)}</h2>
    <div class="stack">
      <div class="card ach"><h3>${esc(u.skills.langs)}</h3><div class="tags" style="margin-top:8px">${cv.languages.map(t => `<span class="tag big">${esc(t)}</span>`).join("")}</div></div>
      <div class="card ach"><h3>${esc(u.skills.gear)}</h3><div class="tags" style="margin-top:8px">${cv.gear.map(t => `<span class="tag">${ltr(t)}</span>`).join("")}</div></div>
    </div>` },

  skills: { render: (cv, u) => `
    <div class="label">${esc(u.skills.label)}</div><h2 class="stitle">${esc(u.skills.h)}</h2>
    <div class="grid2">
      <div class="card"><h3>${esc(u.skills.core)}</h3><div class="tags">${cv.skills.map(t => `<span class="tag big">${ltr(t)}</span>`).join("")}</div></div>
      <div class="card"><h3>${esc(u.skills.tools)}</h3><div class="tags">${cv.tools.map(t => `<span class="tag">${ltr(t)}</span>`).join("")}</div></div>
      <div class="card"><h3>${esc(u.skills.langs)}</h3><div class="tags">${cv.languages.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>
      <div class="card"><h3>${esc(u.skills.gear)}</h3><div class="tags">${cv.gear.map(t => `<span class="tag">${ltr(t)}</span>`).join("")}</div></div>
    </div>` },

  contact: { render: (cv, u) => `
    <div class="contact-wrap">
      <div>
        <div class="label">${esc(u.contact.label)}</div>
        <div class="big">${esc(u.contact.big)}<span>.</span></div>
        <div class="contacts">${cv.contact.map(c => `
          <div><strong>${esc(c.label)}:</strong> ${c.href ? `<a href="${esc(c.href)}" target="_blank" rel="noopener">${ltr(c.value)}</a>` : esc(c.value)}</div>`).join("")}</div>
      </div>
      ${(cv.workLinks || []).length ? `<div class="worklinks">
        <div class="sub">${esc(u.contact.links)}</div>
        <div class="wl">${cv.workLinks.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(typeof l.name === "object" ? l.name[lang] : l.name)}</a>`).join("")}</div>
        ${window.CV_ATS ? `<div class="ats"><div class="sub" dir="${u.dir}" style="text-align:left;width:min(280px,100%)">${esc(u.contact.ats)}</div>
        <div class="wl"><a class="dl" href="#" data-ats="pdf">PDF</a></div></div>` : ""}
      </div>` : ""}
    </div>` }
};

function build(k){
  const v = VARIANTS[k] || {};
  const cv = { ...COMMON, ...CV_DATA[lang], ...(v[lang] || {}) };
  if (v.skillsFirst) {
    const first = v.skillsFirst;
    cv.skills = [...first.filter(n => cv.skills.includes(n)), ...cv.skills.filter(s => !first.includes(s))];
  }
  if (v.workTags) {
    const score = w => (w.tags||[]).filter(t => v.workTags.includes(t)).length;
    cv.work = cv.work.filter(w => score(w) > 0).sort((a,b) => score(b) - score(a));
  }
  const withPoints = e => ({ ...e, points: (e.pointsBy && e.pointsBy[k]) || e.points });
  cv.experience = cv.experience.map(withPoints);
  cv.experienceEarly = cv.experienceEarly.map(withPoints);
  cv.experienceStart = (cv.experienceStart || []).map(withPoints);
  cv.hideSlides = [...(COMMON.hideSlides || []), ...(v.hideSlides || [])];
  return cv;
}

let ids = [], idx = 0;
let currentId = (location.hash.slice(1)) || "cover";

const qs = () => {
  const p = [];
  if (key !== "general") p.push("for=" + key);
  if (editMode) p.push("edit=1");
  return p.length ? "?" + p.join("&") : "";
};
function setURL(id){
  try { history.replaceState(null, "", location.pathname + qs()); } catch (e) {}
}

function render(){
  const cv = build(key), u = UI[lang];
  const root = document.documentElement;
  root.lang = lang; root.dir = u.dir;
  ids = Object.keys(SLIDES).filter(id => !cv.hideSlides.includes(id));
  idx = Math.max(0, ids.indexOf(currentId));

  $("#brand").innerHTML = esc(BRAND) + '<span class="dot">.</span>';
  $("#pdfTxt").textContent = u.pdf;  $("#pdfBtn").title = u.pdf;
  $("#langBtn").textContent = u.langBtn;  $("#langBtn").title = u.langTitle;
  $("#prev").setAttribute("aria-label", u.prev);  $("#next").setAttribute("aria-label", u.next);
  $("#track").innerHTML = ids.map(id => `<section class="slide ${SLIDES[id].dense ? 'dense' : ''}" id="s-${id}"><div class="slide-in">${SLIDES[id].render(cv, u)}</div></section>`).join("");
  $("#dots").innerHTML = ids.map((id,i) => `<button data-i="${i}" aria-label="${esc(u.titles[id])}" title="${esc(u.titles[id])}"></button>`).join("");

  const img = $("#photo");
  if (img) { img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; }; img.src = cv.photo; }
  document.title = cv.name + " – " + u.doc + (cv.forLabel ? " (" + cv.forLabel + ")" : "");
  go(idx, true);
}

const isRTL = () => lang === "ar";

function go(i, instant){
  idx = Math.max(0, Math.min(ids.length - 1, i));
  currentId = ids[idx];
  const track = $("#track");
  if (instant) track.style.transition = "none";
  track.style.transform = `translateX(${(isRTL() ? 1 : -1) * idx * 100}%)`;      // الاتجاه حسب اللغة
  if (instant) { track.offsetHeight; track.style.transition = ""; }
  document.querySelectorAll(".slide").forEach((s, n) => { s.classList.toggle("active", n === idx); if (n === idx) s.scrollTop = 0; });
  document.querySelectorAll("#dots button").forEach((b, n) => b.classList.toggle("on", n === idx));
  $("#count").textContent = (idx + 1) + " / " + ids.length;
  $("#prev").disabled = idx === 0;
  $("#next").disabled = idx === ids.length - 1;
  setURL(currentId);
}

$("#prev").onclick = () => go(idx - 1);
$("#next").onclick = () => go(idx + 1);
$("#track").addEventListener("click", e => {
  const d = e.target.closest("[data-ats]");
  if (d && window.CV_ATS) {
    e.preventDefault();
    const t = d.dataset.ats, a = document.createElement("a");
    a.href = (t === "pdf" ? "data:application/pdf;base64," : "data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,") + window.CV_ATS[t];
    a.download = "Maamoun_Albibi_CV_ATS." + t;
    document.body.appendChild(a); a.click(); a.remove(); return;
  }
});
$("#track").addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (!a) return; e.preventDefault(); const i = ids.indexOf(a.dataset.go); if (i >= 0) go(i); });
document.addEventListener("click", e => {
  const m = document.querySelector(".menu"); if (!m) return;
  const b = e.target.closest("[data-menu]"), btn = document.querySelector("[data-menu]");
  if (b) { const o = m.classList.toggle("open"); b.setAttribute("aria-expanded", o ? "true" : "false"); }
  else if (!e.target.closest(".menu")) { m.classList.remove("open"); if (btn) btn.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { const m = document.querySelector(".menu"); if (m) m.classList.remove("open"); } });
$("#dots").onclick = e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); };
$("#langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; render(); };
document.addEventListener("keydown", e => {
  const fwd = isRTL() ? "ArrowLeft" : "ArrowRight", back = isRTL() ? "ArrowRight" : "ArrowLeft";
  if (e.key === fwd  || e.key === "PageDown") go(idx + 1);
  if (e.key === back || e.key === "PageUp")   go(idx - 1);
});

// عجلة الماوس / التراكباد: تقليب السلايدات (لو السلايد طويل بيسكرول أول، وبعد ما يوصل لآخره بيقلب)
let wheelLock = false, wheelT;
$(".deck").addEventListener("wheel", e => {
  const dy = e.deltaY, dx = e.deltaX, d = Math.abs(dx) > Math.abs(dy) ? dx : dy;
  if (Math.abs(d) < 8) return;
  const s = document.querySelector(".slide.active");
  if (s && Math.abs(dy) >= Math.abs(dx) && s.scrollHeight > s.clientHeight + 2) {
    const atTop = s.scrollTop <= 0, atBottom = s.scrollTop + s.clientHeight >= s.scrollHeight - 2;
    if ((d > 0 && !atBottom) || (d < 0 && !atTop)) return;      // خلي السكرول الطبيعي يشتغل
  }
  e.preventDefault();
  clearTimeout(wheelT); wheelT = setTimeout(() => { wheelLock = false; }, 180);
  if (wheelLock) return;
  wheelLock = true;
  go(idx + (d > 0 ? 1 : -1));
}, { passive: false });

// سحب بالإصبع (عربي: سحب لليمين = التالي، إنجليزي: سحب لليسار = التالي)
let tx = 0, ty = 0;
$(".deck").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$(".deck").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go((dx > 0) === isRTL() ? idx + 1 : idx - 1);
}, { passive: true });

// تحميل PDF = طباعة (كل سلايد صفحة). اسم الملف الافتراضي = عنوان الصفحة
$("#pdfBtn").onclick = () => {
  // 1) PDF مدمج بالنسخة الخاصة، 2) ملف PDF جاهز بجانب الصفحة (COMMON.pdfFiles)، 3) وإلا طباعة
  const emb = window.CV_PDFS && (window.CV_PDFS[key + "_" + lang] || window.CV_PDFS["general_" + lang]);
  const file = COMMON.pdfFiles && COMMON.pdfFiles[lang];
  if (!emb && !file) return window.print();
  const a = document.createElement("a");
  a.href = emb ? "data:application/pdf;base64," + emb : file;
  a.download = file || ("Maamoun_Albibi_CV_" + (lang === "ar" ? "Arabic" : "English") + ".pdf");
  document.body.appendChild(a); a.click(); a.remove();
};

// شريط التحرير: يظهر فقط مع ?edit
function renderEditBar(){
  if (!editMode) return;
  $("#editbar").innerHTML = `<div class="editbar">
    وضع التحرير – اختار نسخة للمعاينة. الرابط اللي بتبعته للشخص: <code>?for=${esc(key)}&amp;lang=${esc(lang)}</code> (بدون edit)
    <div class="chips">${Object.keys(VARIANTS).map(k => `<button class="${k===key?'on':''}" data-k="${k}">${esc((VARIANTS[k].label || {}).ar || k)}</button>`).join("")}</div></div>`;
  $("#editbar").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    key = b.dataset.k;
    renderEditBar(); render();
  };
}

renderEditBar();
render();
</script>
