    en:{ h:"Story & approach",
      lead:"I turn ideas into motion, and everyday images into stories worth watching.",
      sub:"A graphic and motion designer and video editor from Damascus, Syria, now based in Istanbul. Over 18 years of experience creating visual content, working with Star Animation, New Boy, tareekhuna.com, Reflection Media and TRT Arabi, and for more than a decade building a commercial presence selling digital products on Creative Market, Envato, Motion Array and Yellow Images.",
      p:["I'm Maamoun Albibi, a graphic and motion designer and video editor originally from Damascus, Syria, now based in Istanbul, with over 18 years of experience creating visual content. My work spans graphic design, motion graphics, video editing and the use of AI tools.",
         "Over the years I've worked with <a class='coname colink' href='https://www.linkedin.com/company/star-animation/' target='_blank' rel='noopener'>Star Animation</a> | <a class='coname colink' href='https://www.linkedin.com/company/newboypage/' target='_blank' rel='noopener'>New Boy</a> | <a class='coname colink' href='https://tareekhuna.com/' target='_blank' rel='noopener'>tareekhuna.com</a> | <a class='coname colink' href='https://www.linkedin.com/company/reflectionstr/' target='_blank' rel='noopener'>Reflection Media</a> | <a class='coname colink' href='https://www.linkedin.com/company/trtarabi/' target='_blank' rel='noopener'>TRT Arabi</a>, moving between movement and stillness: animated titles and brand motion on one side, TV show branding, social media graphics and abstract 3D on the other.",
         "For over a decade I've also created and sold digital products through <bdi class='coname'>Creative Market</bdi> | <bdi class='coname'>Envato</bdi> | <bdi class='coname'>Motion Array</bdi> | <bdi class='coname'>Yellow Images</bdi>, building a sustained commercial presence across these platforms. I believe there's strength in coming together, and that teamwork is key to innovation and progress — I'm always open to new opportunities and creative collaborations."],
      cta:"Have a project in mind? Let's talk." },
    ar:{ h:"القصة والأسلوب",
      lead:"بحوّل الأفكار إلى حركة، والصور اليومية إلى قصص تستاهل المشاهدة.",
      p:["أنا مأمون البيبي، مصمم جرافيك وموشن ومونتير فيديو، أصلي من دمشق سوريا، ومقيم حالياً في إسطنبول، وعندي خبرة أكتر من 18 سنة بصناعة المحتوى البصري. شغلي بيمتد من التصميم الجرافيكي والموشن جرافيك، للمونتاج، واستخدام أدوات الذكاء الاصطناعي.",
         "على مدار السنين اشتغلت مع <a class='coname colink' href='https://www.linkedin.com/company/star-animation/' target='_blank' rel='noopener'>Star Animation</a> | <a class='coname colink' href='https://www.linkedin.com/company/newboypage/' target='_blank' rel='noopener'>New Boy</a> | <a class='coname colink' href='https://tareekhuna.com/' target='_blank' rel='noopener'>tareekhuna.com</a> | <a class='coname colink' href='https://www.linkedin.com/company/reflectionstr/' target='_blank' rel='noopener'>Reflection Media</a> | <a class='coname colink' href='https://www.linkedin.com/company/trtarabi/' target='_blank' rel='noopener'>TRT Arabi</a>، وتنقّلت بين الحركة والثبات: من تايتلز متحركة وهوية بصرية حركية من جهة، لهوية برامج تلفزيونية وغرافيكس سوشيال ميديا وثري دي تجريدي من جهة تانية.",
         "ولأكتر من عشر سنين، بصمم وببيع منتجات رقمية عبر <bdi class='coname'>Creative Market</bdi> | <bdi class='coname'>Envato</bdi> | <bdi class='coname'>Motion Array</bdi> | <bdi class='coname'>Yellow Images</bdi>، وبنيت حضور تجاري مستمر عبر هالمنصات. بآمن إنه في قوة بالتعاون، وإنه العمل الجماعي أساس الابتكار والتقدم — ودايماً منفتح على فرص وتعاونات إبداعية جديدة."],
      cta:"عندك مشروع ببالك؟ خلينا نحكي." },
    tr:{ h:"Hikaye ve yaklaşım",
      lead:"Fikirleri harekete, günlük görselleri de izlenmeye değer hikayelere dönüştürüyorum.",
      p:["Ben Maamoun Albibi, aslen Şam, Suriye'den, şu anda İstanbul'da yaşayan bir grafik ve hareketli grafik tasarımcısı ve video editörüyüm. 18 yılı aşkın görsel içerik üretme deneyimim var. Çalışmalarım grafik tasarım, motion graphics, video kurgu ve yapay zeka araçlarının kullanımını kapsıyor.",
         "Yıllar içinde <a class='coname colink' href='https://www.linkedin.com/company/star-animation/' target='_blank' rel='noopener'>Star Animation</a> | <a class='coname colink' href='https://www.linkedin.com/company/newboypage/' target='_blank' rel='noopener'>New Boy</a> | <a class='coname colink' href='https://tareekhuna.com/' target='_blank' rel='noopener'>tareekhuna.com</a> | <a class='coname colink' href='https://www.linkedin.com/company/reflectionstr/' target='_blank' rel='noopener'>Reflection Media</a> | <a class='coname colink' href='https://www.linkedin.com/company/trtarabi/' target='_blank' rel='noopener'>TRT Arabi</a> ile çalıştım; hareket ile durağanlık arasında gidip geldim: bir yanda animasyonlu başlıklar ve marka hareketi, diğer yanda TV program kimlikleri, sosyal medya grafikleri ve soyut 3D çalışmalar.",
         "On yılı aşkın süredir <bdi class='coname'>Creative Market</bdi> | <bdi class='coname'>Envato</bdi> | <bdi class='coname'>Motion Array</bdi> | <bdi class='coname'>Yellow Images</bdi> üzerinden dijital ürünler tasarlayıp satıyorum ve bu platformlarda sürekli bir ticari varlık oluşturdum. Bir araya gelmenin güç kattığına ve ekip çalışmasının yenilik ile ilerlemenin anahtarı olduğuna inanıyorum — yeni fırsatlara ve yaratıcı iş birliklerine her zaman açığım."],
      cta:"Aklında bir proje mi var? Hadi konuşalım." },

    {home:4,title:"Al Quds",cat:"Motion Graphics",tag:"Motion Graphics",ac:"#c9a24b",c1:"#000000",c2:"#161616",sw:16,img:"/video/alquds/Reference-alquds-5.jpg",video:"",youtube:"",vf:"alquds",vids:[{n:"alquds",p:false},{n:"Reference-alquds-01",p:false},{n:"Reference-alquds-02",p:false}],ig:false,imgs:["/video/alquds/Reference-alquds-01.jpg","/video/alquds/Reference-alquds-02.jpg","/video/alquds/Reference-alquds-03.jpg","/video/alquds/Reference-alquds-5.jpg"],n:0,desc:"Motion graphics for a program about the tunnels of Al Quds (Jerusalem) in Palestine. The work was produced in Photoshop and After Effects, with scenes generated using Hexfield / Nano Banana.",descAr:"موشن جرافيك لبرنامج يتناول أنفاق القدس في فلسطين. نُفّذ العمل باستخدام <span style=\"white-space:nowrap\"><bdi>Photoshop</bdi> و <bdi>After Effects</bdi>،</span> مع مشاهد تم توليدها باستخدام <span style=\"white-space:nowrap\"><bdi>Hexfield / Nano Banana</bdi>.</span>",descTr:"Filistin'deki Kudüs tünellerini konu alan bir program için hareketli grafik çalışması. Çalışma Photoshop ve After Effects ile hazırlandı; sahneler Hexfield / Nano Banana ile üretildi."},
    {home:2,title:"Murooth",cat:"Motion Graphics",tag:"Motion Graphics",thumbs:true,ac:"#db6c59",c1:"#000000",c2:"#161616",sw:16,img:"",cv:"/video/murooth/hover720.mp4",video:"",youtube:"",vf:"murooth",vids:[{n:"murooth-01",p:false},{n:"murooth-02",p:false},{n:"murooth-03",p:false}],ig:false,imgs:Array.from({length:13},function(_,k){return "/images/murooth/"+(k<9?"0":"")+(k+1)+".jpg"}),n:13,link:"https://www.youtube.com/watch?v=2wZ-qJRQr2s",desc:"Murooth is a documentary series produced by Tareekhuna and directed by Murat Akdeniz, exploring Islamic heritage and its impact on architecture, society and the individual. I designed the show's complete visual identity and graphic style, and created motion graphics sequences combining editing and motion design: about three minutes of animated shots in Episode 01 with Egyptian architect Professor Abdel-Wahed El-Wakil.<br><br>Episode 01, titled \"From Medina to London: The Most Prominent Architects of Our Time\", was published on 21 October 2025 and has passed 1.2 million views. In it, El-Wakil, who built Islamic landmarks from Medina to London, as well as in Jeddah and Cairo, explains how he raised a massive 40-meter-high dome using only bricks, without any concrete or steel. His buildings have stood as enduring monuments through hurricanes and floods, while many modern structures have not. Murooth takes us back to Islamic heritage and its impact on architecture, society and the individual, showing that Islamic architecture is not merely about construction: it is a message whose influence extends through civilization and humanity.",descAr:"«موروث» (Murooth) سلسلة وثائقية من إنتاج <bdi>Tareekhuna</bdi> وإخراج الأستاذ مراد أكدينيز، تتناول التراث الإسلامي وأثره في العمارة والمجتمع والإنسان. صممتُ الهوية البصرية الكاملة للبرنامج وأسلوبه الجرافيكي، وأنجزتُ مشاهد موشن جرافيك تجمع بين المونتاج والتحريك، بمدة نحو ثلاث دقائق في الحلقة الأولى مع المهندس المعماري المصري الأستاذ عبد الواحد الوكيل.<br><br>الحلقة الأولى بعنوان «من المدينة المنورة إلى لندن: أبرز معماريي عصرنا» نُشرت في 21 أكتوبر 2025 وتجاوزت 1.2 مليون مشاهدة. يروي فيها الوكيل، الذي شيّد معالم إسلامية من المدينة المنورة إلى لندن، وكذلك في جدة والقاهرة، كيف رفع قبة ضخمة بارتفاع 40 متراً من الطوب وحده، دون أي خرسانة أو حديد. وقد صمدت مبانيه أمام الأعاصير والفيضانات بينما لم تصمد كثير من المنشآت الحديثة. تعود «موروث» بنا إلى التراث الإسلامي وأثره في العمارة والمجتمع والإنسان، لتبيّن أن العمارة الإسلامية ليست مجرد بناء، بل رسالة يمتد تأثيرها عبر الحضارة والإنسانية.",descTr:"Murooth, yapımcılığını Tareekhuna'nın, yönetmenliğini Murat Akdeniz'in üstlendiği; İslami mirası ve bu mirasın mimari, toplum ve birey üzerindeki etkisini ele alan bir belgesel serisidir. Programın tüm görsel kimliğini ve grafik stilini tasarladım; kurguyu ve hareketli grafiği birleştiren yaklaşık üç dakikalık animasyonlu sahneler hazırladım. Bu sahneler, Mısırlı mimar Prof. Abdel-Wahed El-Wakil ile yapılan ilk bölümde yer alıyor.<br><br>\"Medine'den Londra'ya: Çağımızın En Önde Gelen Mimarları\" başlıklı ilk bölüm 21 Ekim 2025'te yayımlandı ve 1,2 milyon izlenmeyi aştı. Medine'den Londra'ya, Cidde ve Kahire'ye uzanan İslami yapılar inşa eden El-Wakil, 40 metre yüksekliğindeki devasa bir kubbeyi beton ya da çelik kullanmadan, yalnızca tuğlayla nasıl yükselttiğini anlatıyor. Yapıları kasırgalara ve seller karşısında ayakta kalırken pek çok modern yapı dayanamadı. Murooth bizi İslami mirasa ve onun mimari, toplum ve birey üzerindeki etkisine götürüyor; İslam mimarisinin yalnızca inşaat olmadığını, etkisi medeniyet ve insanlık boyunca süren bir mesaj olduğunu gösteriyor."},
    {title:"Inquisition",cat:"Motion Graphics",tag:"Motion Graphics",thumbs:true,ac:"#c0392b",c1:"#000000",c2:"#161616",sw:16,img:"https://i.vimeocdn.com/video/2210584097-9cbc1c98bc242c9de470b160e76595a5cfbe67f9420ba9741d34423a5596a8f2-d?f=webp&region=us",video:"",youtube:"",vids:[{vm:"1234555285",h:"b8a9a94070"}],ig:false,imgs:Array.from({length:5},function(_,k){return "/video/inquisition/0"+(k+1)+".jpg"}),n:5,link:"https://vimeo.com/maamounalbib/inquisitiona",desc:"Design and animation of the intro for an episode on the Inquisition in Al-Andalus, presented by Mr. Murat Akdeniz.",descAr:"تصميم وتحريك إنترو لحلقة عن محاكم التفتيش في الأندلس يقدّمها الأستاذ مراد أكدنيز.",descTr:"Sayın Murat Akdeniz'in sunduğu, Endülüs'teki Engizisyon mahkemelerini konu alan bir bölümün jeneriğinin tasarımı ve animasyonu."},
    {title:"TRT",cat:"Motion Graphics",tag:"Kids Animation",ac:"#ff5a1f",c1:"#000000",c2:"#161616",sw:16,img:"/video/trt/trt-01.jpg",video:"",youtube:"",thumbs:true,vf:"trt",vids:["trt-01","trt-02","trt-03","trt-04",{n:"storyboard",p:"storyboard-01"}],ig:false,imgs:["/video/trt/storyboard-01.jpg","/video/trt/storyboard-02.jpg","/video/trt/storyboard-03.jpg","/video/trt/storyboard-04.jpg","/video/trt/storyboard-05.jpg","/video/trt/storyboard-06.jpg","/video/trt/storyboard-07.jpg","/video/trt/storyboard-08.jpg","/video/trt/storyboard-09.jpg","/video/trt/storyboard-10.jpg"],n:0,desc:"Short, purposeful animated cartoons made for the TRT channel (2012–2013), shown here with the storyboard. Animation: Maamoun Albibi. Drawing: Yaman Batikha.",descAr:"رسوم متحركة قصيرة وهادفة أُنتجت لقناة TRT (2012–2013)، مع الستوري بورد. التحريك: Maamoun Albibi. الرسم: Yaman Batikha.",descTr:"TRT kanalı için hazırlanan kısa ve amaçlı animasyonlar (2012–2013), storyboard ile birlikte. Animasyon: Maamoun Albibi. Çizim: Yaman Batikha."},
    {title:"Polygon Tunnel Backgrounds",cat:"Motion Graphics",tag:"Loop Backgrounds",ac:"#2f7bff",c1:"#000000",c2:"#161616",sw:16,img:"https://i.vimeocdn.com/video/2134193632-60cd52f7b7f88ce910c0d9c61b585e8cf2aa948ffd1faecbb0c86746d22e342e-d?f=webp&region=us",video:"",youtube:"",vids:[{vm:"1173778471"}],ig:false,imgs:[],n:0,link:"https://vimeo.com/maamounalbib/polygon-tunnel-backgrounds",links:[{t:"Motion Array",u:"https://motionarray.com/stock-video/pack-of-21-neon-polygon-tunnels-loop-2727790/"},{t:"Gumroad",u:"https://bibiart.gumroad.com/l/qtjcu?layout=profile"}],desc:"A pack of 21 seamless looping backgrounds built around glowing polygon tunnels in purple, blue, pink and green, each with a slow inward zoom. Every clip is delivered in 4K UHD (3840×2160) as Apple ProRes 422, ready to drop into motion graphics, presentations, YouTube and Instagram content, podcast intros, live visuals and LED shows.",descAr:"حزمة من 21 خلفية متحركة بحلقات سلسة، مبنية على أنفاق متعددة الأضلاع متوهّجة بألوان البنفسجي والأزرق والوردي والأخضر، مع حركة تقريب بطيئة نحو الداخل. يأتي كل مقطع بدقة 4K UHD (3840×2160) بصيغة Apple ProRes 422، جاهزاً للاستخدام في الموشن غرافيك والعروض التقديمية ومحتوى YouTube وInstagram ومقدمات البودكاست والعروض المرئية الحية وشاشات LED.",descTr:"Mor, mavi, pembe ve yeşil tonlarında parlayan çokgen tünellerden oluşan, kesintisiz döngüye sahip 21 arka planlık bir paket; her biri içe doğru yavaş bir zoom hareketi içerir. Her klip 4K UHD (3840×2160) çözünürlükte Apple ProRes 422 olarak sunulur ve motion graphics, sunumlar, YouTube ve Instagram içerikleri, podcast jenerikleri, canlı görsel gösteriler ve LED ekranlar için hazırdır."},
    {title:"Showreel 2024",cat:"Motion Graphics",tag:"Stock Showreel",ac:"#ff5a1f",c1:"#000000",c2:"#161616",sw:16,img:"https://i.vimeocdn.com/video/2181684959-be9cae07353682a56134b71ba5163d2eea6af99b000ca3409f91e473863db29b-d?f=webp&region=us",video:"",youtube:"",vids:[{vm:"1211496822",h:"5589c847f3"}],ig:false,imgs:[],n:0,link:"https://vimeo.com/maamounalbib/showreel-2024",desc:"Showreel 2024 – Stock Motion Graphics & Abstract Visuals. A collection of abstract backgrounds and motion graphics created using Cinema 4D, Octane Render, and Adobe After Effects. This showreel features a selection of my stock visual work designed for motion graphics, presentations, digital content, and creative projects. These visuals are available on Envato Elements and Motion Array.",descAr:"Showreel 2024 – موشن غرافيك وخلفيات تجريدية للمخزون. مجموعة من الخلفيات التجريدية والموشن غرافيك المنفّذة باستخدام Cinema 4D وOctane Render وAdobe After Effects. يضم هذا الـ Showreel مختارات من أعمالي البصرية المخصّصة للمخزون، والمصمّمة للموشن غرافيك والعروض التقديمية والمحتوى الرقمي والمشاريع الإبداعية. تتوفر هذه المرئيات على Envato Elements وMotion Array.",descTr:"Showreel 2024 – Stok Motion Graphics ve Soyut Görseller. Cinema 4D, Octane Render ve Adobe After Effects kullanılarak hazırlanmış soyut arka planlar ve motion graphics çalışmalarından oluşan bir koleksiyon. Bu showreel, motion graphics, sunumlar, dijital içerik ve yaratıcı projeler için tasarladığım stok görsel işlerimden bir seçki sunar. Bu görseller Envato Elements ve Motion Array üzerinde mevcuttur."},
    {home:3,title:"Hadaratuna",cat:"Graphic Design",tag:"Show Branding",ac:"#c9a24b",c1:"#000000",c2:"#161616",sw:16,img:GD[0],video:"",youtube:"",ig:false,imgs:GD.filter(function(_,k){return k!==1}),n:4,desc:"I developed the visual identity for the Hadaratuna program on the Tarikhuna platform and designed layouts combining the presenter with images related to each episode. I generated the images using Hexfield and used Hexfield / Seedream to generate some decorative elements and 3D assets. I then refined and integrated these elements in Photoshop to create the final designs.<br><br>Gold symbolizes the prosperity and value of our civilization, while the dark backgrounds reflect depth and stability, with light gradients adding a visual balance that expresses the continuity and integrity of civilization.",descAr:"طوّرت الهوية البصرية لبرنامج «حضارتنا» على منصة تاريخنا، وصممت كوادر تجمع المقدم بصور مرتبطة بموضوع الحلقة، بتكوينات ونِسَب مختلفة. أنشأت الصور باستخدام Hexfield، واستخدمت Hexfield / Seedream لتوليد بعض الزخارف والعناصر ثلاثية الأبعاد. بعد ذلك عالجت العناصر ودمجتها في Photoshop ضمن التصميم النهائي.<br><br>الذهب يرمز لازدهار حضارتنا وقيمتها، بينما الخلفيات الداكنة تعكس العمق والثبات، مع تدرجات فاتحة تمنح توازناً بصرياً يعبر عن استمرارية الحضارة وتكاملها.",descTr:"Tarikhuna platformundaki Hadaratuna programı için görsel kimliği geliştirdim ve sunucuyu her bölümle ilgili görsellerle birleştiren tasarımlar oluşturdum. Görselleri Hexfield ile ürettim, bazı dekoratif öğeler ve 3D varlıklar için Hexfield / Seedream kullandım. Ardından bu öğeleri Photoshop'ta işleyip nihai tasarımlarda birleştirdim.<br><br>Altın, medeniyetimizin refahını ve değerini simgelerken koyu arka planlar derinliği ve kararlılığı yansıtır; açık tonlu geçişler ise medeniyetin sürekliliğini ve bütünlüğünü ifade eden görsel bir denge sağlar."},
    {title:"On This Day",cat:"Graphic Design",tag:"Show Branding",ac:"#ff5a2c",c1:"#000000",c2:"#161616",sw:16,img:"/images/al-hiwar/01/01.jpg",video:"",youtube:"",ig:false,imgs:Array.from({length:7},function(_,k){return "/images/al-hiwar/01/0"+(k+1)+".jpg"}),n:7,desc:"Visual identity for “On This Day,” a history television programme exploring events that happened on this date. The design combines newspaper collage, aged paper textures, charcoal backgrounds, and orange-red accents to connect historical storytelling with a contemporary broadcast style.",descAr:"الهوية البصرية لبرنامج «في مثل هذا اليوم»، برنامج تاريخي يستعرض أحداثاً وقعت في مثل هذا اليوم عبر السنوات. يجمع التصميم بين قصاصات الجرائد وخامات الورق المعتّق والخلفيات الفحمية واللمسات البرتقالية المحمرة، لربط السرد التاريخي بأسلوب بصري تلفزيوني معاصر.",descTr:"Bu tarihte yaşanmış olayları ele alan tarih programı “On This Day” için görsel kimlik. Tasarım; gazete kolajını, eskitilmiş kağıt dokularını, kömür grisi arka planları ve turuncu-kırmızı vurguları bir araya getirerek tarihî anlatıyı çağdaş bir televizyon diliyle buluşturuyor."},
    {home:5,title:"Nabd Al-Alam",cat:"Graphic Design",tag:"Show Branding",ac:"#2f6fe4",c1:"#000000",c2:"#161616",sw:16,img:WD[0],video:"",youtube:"",ig:false,imgs:WD,n:4,desc:"I designed the visual identity for Nabd Al-Alam, a one-minute news program that follows the most important events and developments around the world, giving viewers a quick, well-sourced summary of the key political, economic and humanitarian news, with a brief reading of what is happening across the continents. The identity covers the title design and the on-screen layouts, in a bold blue and red look.<br><b style=\"color:var(--ink)\">Made for Alhiwar TV.</b>",descAr:"صمّمت الهوية البصرية لبرنامج «نبض العالم»، وهو برنامج إخباري مدته دقيقة واحدة يواكب أبرز الأحداث والتطورات حول العالم، ويقدّم للمشاهد خلاصة سريعة وموثّقة لأهم الأخبار السياسية والاقتصادية والإنسانية، مع قراءة مختصرة لما يجري في مختلف القارات. شملت الهوية تصميم العنوان وتكوينات الشاشة بلمسة جريئة من الأزرق والأحمر.<br><b style=\"color:var(--ink)\">أُنجز لقناة <bdi>Alhiwar TV</bdi>.</b>",descTr:"Nabd Al-Alam programının görsel kimliğini tasarladım; dünya genelindeki önemli olay ve gelişmeleri takip eden, bir dakikalık bir haber programı. İzleyiciye başlıca siyasi, ekonomik ve insani haberlerin hızlı ve belgeli bir özetini, kıtalarda olup bitenlerin kısa bir değerlendirmesiyle birlikte sunar. Kimlik, başlık tasarımını ve ekran yerleşimlerini kapsar; cesur mavi ve kırmızı tonlarda hazırlandı.<br><b style=\"color:var(--ink)\">Alhiwar TV için hazırlandı.</b>"},

    {title:"Inspire",cat:"Inspiration",tag:"Interactive Website",ac:"#c4267d",c1:"#000000",c2:"#161616",sw:16,img:"/images/inspire/inspire-01.webp",video:"",youtube:"",ig:false,imgs:[],n:0,link:"/lab/inspire/",desc:"Inspire is an interactive website experiment I designed and built, where ideas turn into motion and images into stories. It features a dark 3D low-poly world, animated typography, a music player and a fully animated menu.",descAr:"«Inspire» تجربة موقع تفاعلي صممتُه وبنيتُه، حيث تتحول الأفكار إلى حركة والصور إلى قصص. يضم عالماً ثلاثي الأبعاد داكناً بأشكال هندسية، وخطوطاً متحركة، ومشغّل موسيقى، وقائمة متحركة بالكامل.",descTr:"Inspire, tasarlayıp kodladığım interaktif bir web sitesi denemesi: fikirlerin harekete, görsellerin hikayelere dönüştüğü bir deneyim. Koyu tonlu 3D low-poly bir dünya, hareketli tipografi, müzik çalar ve tamamen animasyonlu bir menü içeriyor."},
    {home:1,title:"TRT Arabi / Social Media Graphics",loopvid:1,cat:"Social Media",tag:"Social Media",ac:"#2ec4c6",c1:"#000000",c2:"#161616",sw:16,img:SMG[0],cv:"/images/trt-arabi/intro-trt.mp4",video:"/images/trt-arabi/intro-trt.mp4",youtube:"",ig:false,imgs:SMG.slice(1),n:4,desc:"A selection of social media graphics and motion graphics I created for TRT Arabi across its social media channels, covering different topics and formats.",descAr:"مجموعة مختارة من تصاميم التواصل الاجتماعي والموشن جرافيك التي نفّذتها لـ<bdi>TRT Arabi</bdi> عبر منصات التواصل الاجتماعي الخاصة بها، تغطي مواضيع وأشكالاً متنوعة.",descTr:"TRT Arabi için sosyal medya kanallarında kullanılmak üzere hazırladığım, farklı konu ve formatları kapsayan sosyal medya grafikleri ve hareketli grafik tasarımlarından bir seçki."},
    {home:6,title:"Explosion",cat:"Abstract 3D",tag:"Abstract 3D Render",ac:"#e8384f",c1:"#000000",c2:"#161616",sw:16,img:AB3[0],video:"",youtube:"",ig:false,imgs:AB3,n:6,link:"https://elements.envato.com/3d-explosion-capsule-particles-backgrounds-E83L8FZ",desc:"A set of high-resolution 3D backgrounds built from capsule-shaped particles in an explosive abstract composition, rendered in glossy red and black tones for a bold, cinematic look. <b style=\"color:var(--ink)\">Created with Cinema 4D and Octane Render.</b>",descAr:"مجموعة خلفيات ثلاثية الأبعاد عالية الدقة، مبنية من جسيمات كبسولية الشكل ضمن تكوين تجريدي انفجاري، بألوان حمراء وسوداء لامعة تمنحها طابعاً جريئاً وسينمائياً. <b style=\"color:var(--ink)\">تم إنتاجها باستخدام Cinema 4D وOctane Render.</b>",descTr:"Kapsül şeklindeki parçacıklardan oluşan, patlayıcı soyut bir kompozisyonla kurgulanmış yüksek çözünürlüklü 3D arka plan seti; cesur ve sinematik bir görünüm için parlak kırmızı ve siyah tonlarında render edildi. <b style=\"color:var(--ink)\">Cinema 4D ve Octane Render ile üretildi.</b>"},
    {home:7,title:"Soft Flow",cat:"Abstract 3D",tag:"Abstract Background",ac:"#ff3d81",c1:"#000000",c2:"#161616",sw:16,img:SF[0],video:"",youtube:"",ig:false,imgs:SF,n:9,link:"https://elements.envato.com/abstract-soft-backgrounds-WNBC5GM",desc:"A set of abstract soft-flow backgrounds with glowing ribbons of color drifting through a blue and pink gradient, for a smooth, modern, dreamlike look. <b style=\"color:var(--ink)\">Created with Cinema 4D and Octane Render.</b>",descAr:"مجموعة خلفيات تجريدية بتدفق ناعم، تحتوي على أشرطة لونية متوهجة تنساب ضمن تدرّج بين الأزرق والوردي، لتمنحها إطلالة ناعمة وعصرية وحالمة. <b style=\"color:var(--ink)\">تم إنتاجها باستخدام Cinema 4D وOctane Render.</b>",descTr:"Mavi ve pembe bir gradyan içinde süzülen parlayan renk şeritleriyle, yumuşak, modern ve rüya gibi bir görünüm sunan soyut 'soft-flow' arka plan seti. <b style=\"color:var(--ink)\">Cinema 4D ve Octane Render ile üretildi.</b>"}
